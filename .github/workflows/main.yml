name: QLCC-FE-Admin Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read #đọc source code của repository.
  packages: write #push package vào GitHub Packages(ghcr)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4 #checkout sang nhanh kich hoat workflow (o day la main)

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build frontend image
        run: |
          cd ql_chungcu-admin
          docker build -t ghcr.io/${{ secrets.REPOSITORY_OWNER }}/qlcc-fe_admin:${{ github.sha }} .

      - name: Push frontend image
        run: docker push ghcr.io/${{ secrets.REPOSITORY_OWNER }}/qlcc-fe_admin:${{ github.sha }}

      - name: Deploy frontend to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            cd /home/atus/qlcc_php/deploy
            OLD_IMAGE_FE_ADMIN=$(docker inspect qlcc_fe_admin --format='{{.Config.Image}}' 2>/dev/null || true)
            echo "Old image: $OLD_IMAGE_FE_ADMIN"

            docker stop qlcc_fe_admin || true
            docker rm qlcc_fe_admin || true
            FRONTEND_ADMIN_TAG=${{ github.sha }} docker compose -f docker-compose-qlcc-php.yml pull qlcc-frontend-admin
            FRONTEND_ADMIN_TAG=${{ github.sha }} docker compose -f docker-compose-qlcc-php.yml up -d qlcc-frontend-admin
            docker compose -f docker-compose-qlcc-php.yml restart nginx
            if [ -n "$OLD_IMAGE_FE_ADMIN" ]; then docker image rm "$OLD_IMAGE_FE_ADMIN" || true; fi
            docker ps

            echo "Frontend admin deployment completed"
